<style>

.w{max-width:780px;margin:0 auto;padding:16px}

ckground:var(--wr)}.i-e{background:var(--ac)}.bar i{display:block;height:100%;background:var(--ac)}
.xp i{background:var(--am)}
.bd{display:flex;gap:10px;flex-wrap:wrap}.bg{flex:1 1 200px;display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--bd);border-radius:10px}
.bg.off{opacity:.38;filter:grayscale(1)}.bg em{font-size:24px;font-style:normal}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
.sc{overflow-x:auto}.up{color:var(--ok)}.dn,.wr{color:var(--wr)}.me td{background:var(--gr);font-weight:700}

<script>
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};

async function kdf(p,salt,n){const k=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:n,hash:'SHA-256'},k,320))}
async function enc(o,k32){const iv=crypto.getRandomValues(new Uint8Array(12)),k=await crypto.subtle.importKey('raw',k32,'AES-GCM',false,['encrypt']);return{iv:b64(iv),ct:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(o)))))}}
async function dec(o,k32){const k=await crypto.subtle.importKey('raw',k32,'AES-GCM',false,['decrypt']);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},k,ub(o.ct))))}
function mkBlob(D,s){const TR=[1,2,3],mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,g=(id,q)=>{const a=D.G[id];return a&&typeof a[q-1]==='number'?a[q-1]:null},

TR.forEach(q=>{if(g(s.s,q)==null)return;const E=bd(q),C=bd(q,s.t);A[q]={cm:mean(C.map(x=>x.a)),em:mean(E.map(x=>x.a)),pc:ps(C,s.s),pe:ps(E,s.s),nc:C.length,ne:E.length}});
