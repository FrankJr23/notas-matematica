.w{max-width:780px;margin:0 auto;padding:16px}

.p.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

ckground:var(--wr)}.i-e{background:var(--ac)}.bar i{display:block;height:100%;background:var(--ac)}
.xp i{background:var(--am)}
.bd{display:flex;gap:10px;flex-wrap:wrap}.bg{flex:1 1 200px;display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--bd);border-radius:10px}
.bg.off{opacity:.38;filter:grayscale(1)}.bg em{font-size:24px;font-style:normal}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
.sc{overflow-x:auto}.up{color:var(--ok)}.dn,.wr{color:var(--wr)}.me td{background:var(--gr);font-weight:700}

lst=`<div class="c" id="sglist"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${SGN[sg]} · ${Z.length}</h2><button data-a="sg" data-v="${sg}">Fechar lista</button></div><p class="mu" style="margin:0 0 8px">${esc(ttl)} · ${tf?'turma '+esc(tf):'toda a escola'}. Ordenados da menor para a maior média. "Falta" é quanto falta para chegar a 70.</p><div class="sc"><table><tr><th>Escola</th><th>Turma</th><th>Aluno</th><th>Matrícula</th>${hdr}<th>Falta</th><th></th></tr>${Z.map(x=>`<tr><td>${rk(x.a)}º</td><td>${esc(x.t)}</td><td>${esc(x.n)}</td><td class="${x.m?'':'wr'}">${x.m?esc(x.m):'faltando'}</td>${q?`<td>${cell(x.a)}</td>${q>=2?[0,1,2].map(k=>`<td>${cell(((D.V[x.s]||{})[q]||[])[k])}</td>`).join(''):''}`:`${TR.map(t=>`<td>${cell(g(x.s,t))}</td>`).join('')}<td><b>${cell(x.a)}</b></td>`}<td class="${sg===2?'wr':'am'}"><b>${f1(70-x.a)}</b></td><td><button data-a="see" data-v="${x.s}">Ver</button></td></tr>`).join('')}</table></div></div>`}
const okk=q?['rk','t','n','m','a','st'].concat(q>=2?['v1','v2','v3']:[]):['rk','t','n','m','1','2','3','a','st'],sk=so&&okk.includes(so.k)?so:null;
const gvs=(x,k)=>k==='rk'?(x.a==null?null:-x.a):k==='t'?x.t:k==='n'?x.n:k==='m'?(+dg(x.m||'')||null):k==='a'?x.a:k==='st'?(x.a==null?null:x.a>=70?2:x.a>=40?1:0):k[0]==='v'?(((D.V[x.s]||{})[q]||[])[+k[1]-1]??null):g(x.s,+k);
const LS=sk?L.slice().sort((x,y)=>{const a=gvs(x,sk.k),b=gvs(y,sk.k);if(a==null||b==null)return a==null&&b==null?0:a==null?1:-1;const c=typeof a==='string'?a.localeCompare(b,'pt-BR',{sensitivity:'base'}):a-b;return c*sk.d}):L;
const sh=(k,l)=>`<th aria-sort="${sk&&sk.k===k?(sk.d>0?'ascending':'descending'):'none'}"><button type="button" class="sh${sk&&sk.k===k?' on':''}" data-a="so" data-v="${k}">${l}<i>${sk&&sk.k===k?(sk.d>0?'▲':'▼'):'⇅'}</i></button></th>`;
const HS=sh('rk','Escola')+sh('t','Turma')+sh('n','Aluno')+sh('m','Matrícula')+(q?sh('a','Média')+(q>=2?sh('v1','AV1')+sh('v2','AV2')+sh('v3','AV3'):''):sh('1','1º')+sh('2','2º')+sh('3','3º')+sh('a','Anual'))+sh('st','Situação')+'<th></th>';
const rows=LS.map(x=>`<tr><td>${x.a!=null?rk(x.a)+'º':'—'}</td><td>${esc(x.t)}</td><td>${esc(x.n)}</td><td class="${x.m?'':'wr'}">${x.m?esc(x.m):'faltando'}</td>${q?`<td>${cell(x.a)}</td>${q>=2?[0,1,2].map(k=>`<td>${cell(((D.V[x.s]||{})[q]||[])[k])}</td>`).join(''):''}`:`${TR.map(t=>`<td>${cell(g(x.s,t))}</td>`).join('')}<td><b>${cell(x.a)}</b></td>`}<td class="${x.a==null?'mu':x.a>=70?'up':x.a>=40?'am':'wr'}">${x.a==null?'Sem nota':x.a>=70?'Aprovado':x.a>=40?'Atenção':'Crítico'}</td><td><button data-a="see" data-v="${x.s}">Ver</button></td></tr>`).join('');
return `<div class="c"><h2>Painel do professor</h2><div class="row"><button class="p ${q?'':'on'}" data-a="ptri" data-v="">Visão anual</button>${TR.map(x=>`<button class="p ${x===q?'on':''}" data-a="ptri" data-v="${x}">${lab(x)}</button>`).join('')}</div><div class="row"><button class="p ${tf?'':'on'}" data-a="tf" data-v="">Toda a escola</button>${tu.map(t=>`<button class="p ${tf===t?'on':''}" data-a="tf" data-v="${esc(t)}">Turma ${esc(t)}</button>`).join('')}</div><div class="mu">Trimestre em andamento: ${TR.map(t=>`<label style="margin-right:12px"><input type="checkbox" data-a="par" data-v="${t}" ${par(t)?'checked':''} style="width:auto"> ${t}º</label>`).join('')}</div></div>
<div class="g"><div class="k"><span>Alunos</span><b>${L.length}</b></div><div class="k"><span>${esc(ttl)}</span><b>${vals.length?f1(mean(vals)):'—'}</b></div><div class="k"><span>Aprovados (70 ou mais)</span><b class="up">${nv(v=>v>=70)}</b></div><div class="k"><span>Em atenção (40 a 69)</span><b class="am">${nv(v=>v>=40&&v<70)}</b></div><div class="k"><span>Críticos (abaixo de 40)</span><b class="wr">${nv(v=>v<40)}</b></div><div class="k"><span>Sem média</span><b>${L.length-W.length}</b></div><div class="k"><span>Sem matrícula</span><b class="${L.some(x=>!x.m)?'wr':''}">${L.filter(x=>!x.m).length}</b></div></div>
<div class="two">${sit}${c2}</div>
${lst}
${c3}
<div class="c sc"><table><tr>${HS}</tr>${rows}</table></div>
<div class="c"><h2>Lançar notas e matrículas</h2><p class="mu">Uma linha por aluno: matrícula;nome completo;turma;trimestre;média (0 a 100);AV1;AV2;AV3. As três AV são opcionais e só valem do 2º trimestre em diante; se a média ficar em branco e as três AV vierem, a média é calculada. Os dados são mesclados com os atuais: só as notas das linhas enviadas mudam. Para só vincular a matrícula, deixe trimestre e média vazios. O aluno é reconhecido pela matrícula ou, se ela estiver em branco, pelo nome completo e turma.</p><textarea id="csv" placeholder="2026101;Maria da Silva;8M;3;72,5"></textarea><div class="row"><button data-a="imp">Aplicar</button><button class="b" data-a="pub">Publicar para os alunos</button></div><p id="msg" class="mu">${esc(note)}</p><p class="mu">Os alunos só veem as mudanças depois de você publicar.</p></div>
<div class="c"><b>Segurança</b><p class="mu" style="margin:4px 0 0">O registro de cada aluno fica criptografado e só abre com a matrícula dele, e os dados do painel só abrem com a sua senha. Isso protege contra curiosidade e inspeção casual da página, mas não contra quem teste matrículas por programa. Para segurança plena, use o sistema com servidor e login.</p></div>
<div class="c"><h2>Senha do painel</h2><p class="mu">Use 12 ou mais caracteres e guarde bem. A nova senha vale a partir da próxima publicação.</p><input id="npw" type="password" autocomplete="new-password"><div class="row"><button data-a="pwd">Trocar senha</button></div></div>`}
function imp(){const L=$('#csv').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let nn=0,mm=0,ne=0;const bad=[];
L.forEach((l,i)=>{const c=l.split(l.includes(';')?';':',').map(x=>x.trim()),m=c[0]||'',nome=c[1]||'',t=(c[2]||'').toUpperCase(),qs=c[3]||'',vs=c[4]||'',q=parseInt(qs),v=parseFloat(vs.replace(',','.'));
if(i===0&&/matr/i.test(m))return;
let s=m&&D.S.find(x=>x.m===m);
if(!s&&nome&&t)s=D.S.find(x=>x.s===sidOf(t,nome));
if(!s){if(!nome||!t){bad.push(i+1);return}const id=sidOf(t,nome);s={s:id,m:'',n:abbr(nome),t,c:null};D.S.push(s);D.G[id]=[null,null,null];ne++}
if(m&&s.m!==m){s.m=m;mm++}
if(qs||vs||c[5]||c[6]||c[7]){const A=[5,6,7].map(k=>c[k]?parseFloat(c[k].replace(',','.')):null),hasA=A.some(x=>x!=null);
if(!(q>=1&&q<=3)||(vs&&(isNaN(v)||v<0||v>100))||A.some(x=>x!=null&&(isNaN(x)||x<0||x>100))||(q===1&&hasA)){bad.push(i+1);return}
if(hasA){const o=D.V[s.s]=D.V[s.s]||{},a=o[q]=o[q]||[null,null,null];A.forEach((x,k)=>{if(x!=null)a[k]=x});if(!vs&&a.every(x=>x!=null)){D.G[s.s][q-1]=Math.round(mean(a)*10)/10;nn++}}
if(vs){D.G[s.s][q-1]=v;nn++}}});
note=`${nn} médias lançadas, ${mm} matrículas vinculadas, ${ne} alunos novos.`+(bad.length?` Linhas ignoradas: ${bad.slice(0,10).join(', ')}.`:'')+' Falta publicar para os alunos verem.'}
async function pub(){const a=window.claude&&await claude.use('artifact');if(!a){note='Publicação indisponível nesta visualização.';return}
const say=t=>{const m=$('#msg');if(m)m.textContent=t};say('Criptografando os registros… na primeira publicação pode levar cerca de 1 minuto.');
try{const salt=ub(E.salt),B=[];let n=0;
for(const s of D.S){if(!s.m)continue;const k=kc[s.m]||(kc[s.m]=await kdf(dg(s.m),salt,E.it));B.push({i:hx(k.slice(32)),...await enc(blobFor(s),k.slice(0,32))});if(++n%20===0)say('Criptografando… '+n+' alunos')}
const ms=crypto.getRandomValues(new Uint8Array(16)),mk=await kdf(pw,ms,E.it),M={salt:b64(ms),...await enc({S:D.S,G:D.G,P:D.P,V:D.V,H:D.H,X:D.X,O:D.O},mk.slice(0,32))};
const j=JSON.stringify({it:E.it,salt:E.salt,M,B,H:D.H}).replace(/</g,'\\u003c');
const html=SRC.replace(/(<script id="data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,x,y)=>x+j+y);
say('Publicando…');await a.publish(html)}catch(e){note='Não foi possível publicar ('+(e.code||e.message)+').';render()}}
function render(){$('#nav').hidden=!isOwner;$('#app').innerHTML=view==='prof'&&isOwner&&pw?prof():view==='lock'&&isOwner?lock():view==='stu'&&cur?student():login()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,y0=window.scrollY||0;
if(a==='login'){const m=dg($('#mat').value),er=$('#err');if(!m){er.textContent='Digite a sua matrícula.';return}b.disabled=true;er.textContent='Verificando…';const r=await sLogin(m);b.disabled=false;if(r){ov=null;cur=r;view='stu';tri=null}else{er.textContent='Matrícula não encontrada. Confira o número e tente de novo.';return}}
else if(a==='out'){ov=null;cur=null;view=isOwner?(pw?'prof':'lock'):'login'}
else if(a==='tab'){view=v==='prof'&&!pw?'lock':v;cur=null}
else if(a==='see'){ov=null;cur=blobFor(D.S.find(s=>s.s===v));view='stu';tri=null}
else if(a==='tri')tri=+v;
else if(a==='tf'){tf=v;sg=null}
else if(a==='so'){so=so&&so.k===v?{k:v,d:-so.d}:{k:v,d:1}}
else if(a==='sg'){sg=sg===+v?null:+v;if(sg!=null)setTimeout(()=>{const e=document.getElementById('sglist');e&&e.scrollIntoView({behavior:'smooth',block:'nearest'})},80)}
else if(a==='ptri'){pt=v?+v:null;sg=null}
else if(a==='par'){const q=+v;D.P=par(q)?D.P.filter(x=>x!==q):D.P.concat(q);note='Status do '+q+'º trimestre alterado. Falta publicar.'}
else if(a==='unlock'){const p=$('#pw').value,el=$('#lerr');if(!p)return;el.textContent='Abrindo…';try{const k=await kdf(p,ub(E.M.salt),E.it);D=await dec(E.M,k.slice(0,32));D.V=D.V||{};pw=p;view='prof'}catch(x){el.textContent='Senha incorreta.';return}}
else if(a==='pwd'){const p=$('#npw').value;note=p.length<12?'A senha precisa ter 12 ou mais caracteres.':(pw=p,'Senha trocada. Falta publicar para valer.')}
else if(a==='imp')imp();
else if(a==='avx'){ov=ov===v?null:v}
else if(a==='pub'){await pub()}
render();if(a==='avx'&&window.scrollTo)window.scrollTo(0,y0)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='mat'||e.target.id==='pw'))document.querySelector(e.target.id==='mat'?'[data-a="login"]':'[data-a="unlock"]').click()});

(async()=>{try{const u=window.claude&&await claude.use('user');if(u&&u.isOwner()){isOwner=true;view='lock';render()}}catch(e){}})();
