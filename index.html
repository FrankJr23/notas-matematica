<style>
:root{--bg:#eef2f9;--cd:#fff;--tx:#101a33;--mu:#5d6882;--ac:#2f4bff;--am:#ffb703;--ok:#14a06e;--wr:#e5484d;--bd:#d9e0ee;--gr:rgba(47,75,255,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--gr) 1px,transparent 1px),linear-gradient(90deg,var(--gr) 1px,transparent 1px);background-size:24px 24px;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:780px;margin:0 auto;padding:16px}
h1,h2,.big{font-family:Sora,system-ui,sans-serif;margin:0}
h1{font-size:22px}h2{font-size:17px;margin-bottom:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px}
.k b{display:block;font:800 26px Sora,system-ui,sans-serif}.k span,.mu{color:var(--mu);font-size:13px}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.big{font-size:64px;font-weight:800;line-height:1;color:var(--ac)}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:130px;font:13px ui-monospace,Menlo,monospace}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:8px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.p.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar{position:relative}.bar:after{content:"";position:absolute;left:70%;top:0;bottom:0;width:2px;background:var(--tx);opacity:.45}.xp:after{display:none}.am{color:var(--am)}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none}.d-ok{background:var(--ok)}.d-am{background:var(--am)}.d-wr{background:var(--wr)}.lt{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.lt small{display:block;color:var(--mu);font-size:12px}.lt .v{margin-left:auto;text-align:right}.hbr{display:grid;grid-template-columns:76px 1fr 46px;align-items:center;gap:8px;margin:8px 0}.hbt{position:relative;height:16px;background:var(--bd);border-radius:8px;overflow:hidden}.hbt i{display:block;height:100%;border-radius:8px}.hbt u{position:absolute;left:70%;top:0;bottom:0;width:2px;background:var(--tx);opacity:.5}.hbr b{text-align:right}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:12px}.two .c{margin-bottom:0}.avb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:8px 0 8px 24px;text-align:left;color:inherit;font:inherit;cursor:pointer}.avb:hover{background:var(--gr)}.avb small{display:block;color:var(--mu);font-size:12px}.avb .v{margin-left:auto;text-align:right}.chev{color:var(--mu);width:14px}.avd{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;margin:4px 0 8px 24px}.cp{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}.cp small{display:block;color:var(--mu);font-size:12px}.cp .v{margin-left:auto;text-align:right;white-space:nowrap}.ic{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;color:#fff}.i-c{background:var(--ok)}.i-p{background:var(--am);color:#1b2233}.i-z,.i-n{background:var(--wr)}.i-e{background:var(--ac)}.bar i{display:block;height:100%;background:var(--ac)}
.xp i{background:var(--am)}
.bd{display:flex;gap:10px;flex-wrap:wrap}.bg{flex:1 1 200px;display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--bd);border-radius:10px}
.bg.off{opacity:.38;filter:grayscale(1)}.bg em{font-size:24px;font-style:normal}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
.sc{overflow-x:auto}.up{color:var(--ok)}.dn,.wr{color:var(--wr)}.me td{background:var(--gr);font-weight:700}
.lg span{margin-right:12px;font-size:12px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
</style></head><body>
